{% extends "base.html" %}

{% block title %}Mapa | AdaptaBrasil{% endblock %}

{% block custom_css %}
    {{ super() }}
{% endblock %}

{% block content %}
  <div class="d-flex" style="height: calc(100vh - 70px);">

  <!-- Barra lateral -->
  <div class="bg-light p-4 border-end" style="width: 400px; overflow-y: auto;">

    <!-- Selects -->
    <div class="mb-3" style="margin-top: 30px;">
      <select class="form-select">
        <option>Brasil</option>
      </select>
    </div>
    <div class="mb-3">
      <select class="form-select">
        <option>27 Unidades Federativas</option>
      </select>
    </div>

    <!-- Ícones dos indicadores -->
    <div class="row row-cols-2 g-3" style="margin-top: 20px;">
      {% for slug, setor in setores.items() %}
      <div class="col">
        <a href="{{ url_for('mapa', indicador=slug) }}" style="text-decoration: none; color: inherit;">
          <div class="card text-center p-3 shadow-sm" style="height: 160px;">
            <img src="{{ url_for('static', filename=setor.icone_local) if setor.icone_local
                        else setor.icone_url or url_for('static', filename='img/adaptabrasil.png') }}"
                 alt="{{ setor.titulo }}"
                 class="mx-auto d-block" style="height: 80px; object-fit: contain; margin-bottom: 8px;">
            <div class="small">{{ setor.titulo }}</div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
  </div></div>

{% endblock %}

{% block custom_js %}
    {{ super() }}
{% endblock %}

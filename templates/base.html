<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AdaptaBrasil{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            padding-top: 70px; /* Espaço antes da navbar fixo */
        }
        .navbar-brand img {
            height: 55px;
        }
        /* Estilo padrão para o mapa (invisível por padrão) */
        #map {
            position: absolute;
            top: 115px; /* abaixo da navbar */
            left: 411px; /* começa após a sidebar */
            right: 0;
            bottom: 0;
        }
    </style>

    {% block custom_css %}
    {% if map_layer %}
        <link rel="stylesheet" href="{{ url_for('static', filename='ol/ol.css') }}">
    {% endif %}
    {% endblock %}
</head>
<body>
    <!-- Navbar fixa na parte superior do site -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow" style="background-color: #ffffff;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img alt="AdaptaBrasil Logo" height="40" class="ms-5" src="{{ url_for('static', filename='img/adaptabrasil.png') }}">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('homepage') }}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('teste') }}">Riscos Climáticos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('teste') }}">Notícias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('teste') }}">Saiba Mais</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('teste') }}">Tutorial</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('teste') }}">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo a ser inserido dependendo da página -->
    <div class="container-fluid">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Atualizaçâo do mapa dinâmico -->
    <div id="map-container">
        {% if map_layer %}
            <div id="map"></div>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block custom_js %}
    {% if map_layer %}
        <script src="{{ url_for('static', filename='ol/ol.js') }}"></script>
        <script>
            // Variável global para manter a instância do mapa
            let map;
            let wmsLayer;

            // Fundo: imagem de satélite da Esri (World Imagery), a mesma do mapa
            // dos indicadores (static/js/mapa.js)
            function criarMapa() {
                map = new ol.Map({
                    target: 'map',
                    layers: [new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                            attributions: 'Esri, Maxar, Earthstar Geographics',
                            maxZoom: 19,
                            crossOrigin: 'anonymous'
                        })
                    })],
                    view: new ol.View({ center: ol.proj.fromLonLat([-53, -14]), zoom: 4 })
                });
                // Brasil inteiro enquadrado, seja qual for a proporção da tela
                map.getView().fit(
                    ol.proj.transformExtent([-74.0, -33.8, -32.3, 5.3], 'EPSG:4326', 'EPSG:3857'),
                    { padding: [20, 20, 20, 20] });
            }

            // Põe (ou troca) uma layer WMS por cima do satélite (teste.html)
            function initMap(layerName) {
                if (!map) criarMapa();
                const source = new ol.source.ImageWMS({
                    url: {{ geoserver_wms_url | tojson }},
                    params: {
                        'LAYERS': layerName,
                        'VERSION': '1.1.0',
                        'FORMAT': 'image/png'
                    },
                    serverType: 'geoserver',
                    crossOrigin: 'anonymous'
                });
                if (wmsLayer) {
                    wmsLayer.setSource(source);
                } else {
                    wmsLayer = new ol.layer.Image({ source: source });
                    map.addLayer(wmsLayer);
                }
            }

            document.addEventListener("DOMContentLoaded", function() {
                if (!map) criarMapa();
            });
        </script>
    {% endif %}
    {% endblock %}
</body>
</html>

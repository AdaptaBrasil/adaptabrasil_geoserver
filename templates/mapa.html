{% extends "base.html" %}

{% block title %}Mapa | AdaptaBrasil{% endblock %}

{% block custom_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='ol/ol.css') }}">
<style>
  #arvore, #arvore ul { list-style: none; padding-left: 0; margin: 0; }
  #arvore ul { padding-left: 1.1rem; }
  .no-indicador { display: flex; align-items: flex-start; }
  .no-indicador .seta {
    border: 0; background: none; width: 1.4rem; flex: none; padding: .25rem 0; color: #555;
  }
  .no-indicador .nome-indicador {
    border: 0; background: none; text-align: left; padding: .25rem .4rem; border-radius: .25rem;
  }
  .no-indicador .nome-indicador:hover { background: #e9ecef; }
  .no-indicador .nome-indicador.ativo { background: #0d6efd; color: #fff; }
  #legenda { list-style: none; padding-left: 0; margin: 0; }
  #legenda li { display: flex; align-items: center; gap: .5rem; margin-bottom: .2rem; font-size: .9rem; }
  #legenda .cor { width: 1.2rem; height: 1.2rem; border: 1px solid #999; flex: none; }
  #info {
    position: fixed; right: 1rem; top: 130px; z-index: 10; background: #fff;
    padding: .5rem .75rem; border-radius: .25rem; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 260px;
  }
</style>
{% endblock %}

{% block content %}
<div class="d-flex" style="height: calc(100vh - 70px);">

  <!-- Barra lateral -->
  <div class="bg-light p-3 border-end" style="width: 400px; height: calc(100vh - 70px); overflow-y: auto;">
    <!-- Título do indicador escolhido na home -->
    <h3 style="margin-top: 3rem; margin-bottom: 1.5rem; font-weight: 500;">{{ titulo }}</h3>

    <!-- Árvore montada a partir de indicator_indicator (static/js/mapa.js) -->
    <ul id="arvore"></ul>

    <!-- Painel do indicador selecionado -->
    <div id="painel-indicador" class="mt-4 pt-3 border-top" hidden>
      <h5 id="indicador-nome" style="font-weight: 500;"></h5>

      <p id="sem-dados" class="text-muted" hidden>Este indicador não tem dados para exibir no mapa.</p>

      <div id="controles">
        <div class="row g-2 mb-3">
          <div class="col">
            <label for="ano" class="form-label small mb-1">Ano</label>
            <select id="ano" class="form-select form-select-sm"></select>
          </div>
          <div class="col">
            <label for="cenario" class="form-label small mb-1">Cenário</label>
            <select id="cenario" class="form-select form-select-sm"></select>
          </div>
        </div>

        <ul id="legenda" class="mb-3"></ul>

        <div class="small">
          Baixar dados:
          <a id="baixar-csv" href="#">CSV</a> ·
          <a id="baixar-shp" href="#">Shapefile</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>
<div id="info" hidden></div>
{% endblock %}

{% block custom_js %}
<script src="{{ url_for('static', filename='ol/ol.js') }}"></script>
<script>window.MAPA_CONFIG = {{ mapa_config | tojson }};</script>
<script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
{% endblock %}
